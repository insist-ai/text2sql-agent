<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="55%" stop-color="#111A31"/>
      <stop offset="100%" stop-color="#0C1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#4F8CFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1190" cy="50" r="240" fill="url(#glow1)"/>
  <circle cx="50" cy="570" r="220" fill="url(#glow2)"/>

  <!-- 标题 -->
  <rect x="72" y="60" width="6" height="54" rx="3" fill="url(#accent)"/>
  <text x="96" y="102" font-size="52" font-weight="700" fill="#FFFFFF">NL2SQL 智能问数系统</text>
  <text x="98" y="146" font-size="23" fill="#8FA3C4">中文口语提问 → 自动生成可执行 SQL → 在数据仓库上执行并给出答案</text>
  <rect x="72" y="170" width="1136" height="2" fill="url(#line)"/>

  <!-- 问数链路 -->
  <g font-size="21" font-weight="600">
    <rect x="72"  y="198" width="164" height="54" rx="12" fill="#1B2740" stroke="#2E4166" stroke-width="1.5"/>
    <rect x="256" y="198" width="164" height="54" rx="12" fill="#1B2740" stroke="#2E4166" stroke-width="1.5"/>
    <rect x="440" y="198" width="164" height="54" rx="12" fill="#1B2740" stroke="#2E4166" stroke-width="1.5"/>
    <rect x="624" y="198" width="164" height="54" rx="12" fill="#1B2740" stroke="#2E4166" stroke-width="1.5"/>
    <rect x="808" y="198" width="164" height="54" rx="12" fill="#1B2740" stroke="#2E4166" stroke-width="1.5"/>
    <rect x="992" y="198" width="164" height="54" rx="12" fill="#152A3A" stroke="#2B6C7E" stroke-width="1.5"/>
    <g fill="#E8EEF9" text-anchor="middle">
      <text x="154"  y="232">多轮改写</text>
      <text x="338"  y="232">双路召回</text>
      <text x="522"  y="232">SQL 生成</text>
      <text x="706"  y="232">安全校验</text>
      <text x="890"  y="232">自省纠错</text>
      <text x="1074" y="232" fill="#7EE3F5">执行返回</text>
    </g>
  </g>
  <g stroke="#3E5180" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 218 L250 225 L244 232"/>
    <path d="M428 218 L434 225 L428 232"/>
    <path d="M612 218 L618 225 L612 232"/>
    <path d="M796 218 L802 225 L796 232"/>
    <path d="M980 218 L986 225 L980 232"/>
  </g>

  <!-- 指标 -->
  <rect x="72" y="280" width="360" height="98" rx="14" fill="#141E33" stroke="#26345A" stroke-width="1.5"/>
  <text x="100" y="332" font-size="38" font-weight="700" fill="#4F8CFF">97.5%</text>
  <text x="100" y="364" font-size="18" fill="#A8B8D4">执行结果准确率 EX · n=50</text>

  <rect x="452" y="280" width="360" height="98" rx="14" fill="#141E33" stroke="#26345A" stroke-width="1.5"/>
  <text x="480" y="332" font-size="38" font-weight="700" fill="#34D399">90.0%</text>
  <text x="480" y="364" font-size="18" fill="#A8B8D4">越界问题拒答准确率 · 误拒答 0%</text>

  <rect x="832" y="280" width="376" height="98" rx="14" fill="#141E33" stroke="#26345A" stroke-width="1.5"/>
  <text x="860" y="332" font-size="38" font-weight="700" fill="#FBBF24">100%</text>
  <text x="860" y="364" font-size="18" fill="#A8B8D4">生成 SQL 可执行率（纠错 ≤3 轮）</text>

  <!-- 示例 -->
  <rect x="72" y="402" width="700" height="202" rx="14" fill="#0E1626" stroke="#26345A" stroke-width="1.5"/>
  <circle cx="100" cy="438" r="5" fill="#FF5F57"/>
  <circle cx="118" cy="438" r="5" fill="#FEBC2E"/>
  <circle cx="136" cy="438" r="5" fill="#28C840"/>
  <text x="160" y="444" font-size="17" fill="#6B7C9E">华东地区一共卖出了多少件商品？</text>
  <g font-family="Consolas, Cascadia Mono, monospace" font-size="19">
    <text x="100" y="490" fill="#7EE3F5">SELECT</text>
    <text x="182" y="490" fill="#FFB86C">SUM</text>
    <text x="228" y="490" fill="#E8EEF9">(fo.order_quantity) AS total_quantity</text>
    <text x="100" y="522" fill="#7EE3F5">FROM</text>
    <text x="164" y="522" fill="#E8EEF9">fact_order fo</text>
    <text x="100" y="554" fill="#7EE3F5">JOIN</text>
    <text x="164" y="554" fill="#E8EEF9">dim_region dr ON fo.region_id = dr.region_id</text>
    <text x="100" y="586" fill="#5C6E90">-- total_quantity: 235</text>
  </g>

  <!-- 技术栈 -->
  <text x="802" y="424" font-size="17" fill="#6B7C9E">技术栈</text>
  <g font-size="17" font-weight="600" text-anchor="middle" fill="#DCE6F7">
    <g fill="#16203A" stroke="#2A3A60" stroke-width="1.2">
      <rect x="802"  y="434" width="196" height="30" rx="8"/>
      <rect x="1010" y="434" width="196" height="30" rx="8"/>
      <rect x="802"  y="474" width="196" height="30" rx="8"/>
      <rect x="1010" y="474" width="196" height="30" rx="8"/>
      <rect x="802"  y="514" width="196" height="30" rx="8"/>
      <rect x="1010" y="514" width="196" height="30" rx="8"/>
      <rect x="802"  y="554" width="196" height="30" rx="8"/>
      <rect x="1010" y="554" width="196" height="30" rx="8"/>
    </g>
    <text x="900"  y="455">FastAPI</text>
    <text x="1108" y="455">LangGraph</text>
    <text x="900"  y="495">Vue 3 + Element Plus</text>
    <text x="1108" y="495">Qdrant</text>
    <text x="900"  y="535">Elasticsearch</text>
    <text x="1108" y="535">MySQL 8</text>
    <text x="900"  y="575">Redis</text>
    <text x="1108" y="575">Docker Compose</text>
  </g>
</svg>
